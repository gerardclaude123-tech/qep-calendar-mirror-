name: Refresh QEP COT Data Mirror

on:
  schedule:
    - cron: '0 21 * * 5'
    - cron: '0 6 * * 6'
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-cot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and parse Forex COT (TFF)
        run: |
          mkdir -p data/cot
          python3 << 'PYEOF'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          # Forex Traders in Financial Futures (TFF) — Socrata API
          # We get most recent week, filtered for our 8 currencies
          base_url = 'https://publicreporting.cftc.gov/resource/gpe5-46if.json'

          mapping = {
              'EURO FX - CHICAGO MERCANTILE EXCHANGE': 'EUR',
              'BRITISH POUND - CHICAGO MERCANTILE EXCHANGE': 'GBP',
              'JAPANESE YEN - CHICAGO MERCANTILE EXCHANGE': 'JPY',
              'AUSTRALIAN DOLLAR - CHICAGO MERCANTILE EXCHANGE': 'AUD',
              'NEW ZEALAND DOLLAR - CHICAGO MERCANTILE EXCHANGE': 'NZD',
              'CANADIAN DOLLAR - CHICAGO MERCANTILE EXCHANGE': 'CAD',
              'SWISS FRANC - CHICAGO MERCANTILE EXCHANGE': 'CHF',
              'U.S. DOLLAR INDEX - ICE FUTURES U.S.': 'USD',
          }

          # Build SoQL query
          where_clauses = ['market_and_exchange_names="' + name + '"' for name in mapping.keys()]
          where = ' OR '.join(where_clauses)
          params = {
              '$where': where,
              '$order': 'report_date_as_yyyy_mm_dd DESC',
              '$limit': '50',
          }
          url = base_url + '?' + urllib.parse.urlencode(params)

          print(f"Fetching from CFTC API...")
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
              print(f"Got {len(data)} records")
          except Exception as e:
              print(f"API fetch failed: {e}")
              data = []

          # Take most recent record per currency
          result = {}
          latest_date = None
          for record in data:
              name = record.get('market_and_exchange_names', '')
              if name in mapping:
                  symbol = mapping[name]
                  if symbol in result:
                      continue  # already have most recent
                  try:
                      lev_long = int(record.get('lev_money_positions_long', 0))
                      lev_short = int(record.get('lev_money_positions_short', 0))
                      total = lev_long + lev_short
                      if total > 0:
                          net_cot = (lev_long - lev_short) / total
                          if -1.0 <= net_cot <= 1.0:
                              result[symbol] = round(net_cot, 4)
                              if not latest_date:
                                  latest_date = record.get('report_date_as_yyyy_mm_dd', '')[:10]
                  except (ValueError, TypeError) as e:
                      print(f"  Parse error for {symbol}: {e}")

          if result:
              forex_cot = {
                  'updated_at': datetime.now(timezone.utc).isoformat(),
                  'report_date': latest_date or 'unknown',
                  'source': 'CFTC Public API (gpe5-46if)',
                  'mirror_by': 'github-actions/qep-calendar-mirror',
                  'currencies': result,
                  'count': len(result),
              }
              with open('data/cot/forex_cot.json', 'w') as f:
                  json.dump(forex_cot, f, indent=2)
              print(f"Forex COT saved: {len(result)} currencies (week of {latest_date})")
              for c, v in result.items():
                  print(f"  {c}: {v:+.3f}")
          else:
              print("No fresh forex COT data, keeping existing file")
          PYEOF

      - name: Fetch and parse Commodities COT (Disaggregated)
        run: |
          python3 << 'PYEOF'
          import json
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          # Commodity Disaggregated COT — Socrata API
          base_url = 'https://publicreporting.cftc.gov/resource/72hh-3qpy.json'

          mapping = {
              'GOLD - COMMODITY EXCHANGE INC.': 'XAU',
              'SILVER - COMMODITY EXCHANGE INC.': 'XAG',
              'CRUDE OIL, LIGHT SWEET-WTI - ICE FUTURES EUROPE': 'WTI',
              'COPPER- #1 - COMMODITY EXCHANGE INC.': 'COPPER',
          }

          where_clauses = ['market_and_exchange_names="' + name + '"' for name in mapping.keys()]
          where = ' OR '.join(where_clauses)
          params = {
              '$where': where,
              '$order': 'report_date_as_yyyy_mm_dd DESC',
              '$limit': '50',
          }
          url = base_url + '?' + urllib.parse.urlencode(params)

          print(f"Fetching from CFTC API...")
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
              print(f"Got {len(data)} records")
          except Exception as e:
              print(f"API fetch failed: {e}")
              data = []

          result = {}
          latest_date = None
          for record in data:
              name = record.get('market_and_exchange_names', '')
              if name in mapping:
                  symbol = mapping[name]
                  if symbol in result:
                      continue
                  try:
                      mm_long = int(record.get('m_money_positions_long_all', 0))
                      mm_short = int(record.get('m_money_positions_short_all', 0))
                      prod_long = int(record.get('prod_merc_positions_long', 0))
                      prod_short = int(record.get('prod_merc_positions_short', 0))
                      swap_long = int(record.get('swap_positions_long_all', 0))
                      swap_short = int(record.get('swap__positions_short_all', 0))
                      oi = int(record.get('open_interest_all', 0))
                      report_date = record.get('report_date_as_yyyy_mm_dd', '')[:10]

                      mm_net = mm_long - mm_short
                      prod_net = prod_long - prod_short
                      swap_net = swap_long - swap_short
                      net_total = prod_net + swap_net + mm_net

                      result[symbol] = {
                          'net': net_total,
                          'mm_net': mm_net,
                          'mm_long': mm_long,
                          'mm_short': mm_short,
                          'producer_net': prod_net,
                          'swap_net': swap_net,
                          'oi': oi,
                          'week': report_date,
                      }
                      if not latest_date:
                          latest_date = report_date
                  except (ValueError, TypeError) as e:
                      print(f"  Parse error for {symbol}: {e}")

          if result:
              commodities_cot = {
                  'updated_at': datetime.now(timezone.utc).isoformat(),
                  'report_date': latest_date or 'unknown',
                  'source': 'CFTC Public API (72hh-3qpy)',
                  'mirror_by': 'github-actions/qep-calendar-mirror',
                  'instruments': result,
                  'count': len(result),
              }
              with open('data/cot/commodities_cot.json', 'w') as f:
                  json.dump(commodities_cot, f, indent=2)
              print(f"Commodities COT saved: {len(result)} instruments (week of {latest_date})")
              for c, v in result.items():
                  print(f"  {c}: net={v['net']:+}, mm_net={v['mm_net']:+}, week={v['week']}")
          else:
              print("No fresh commodities COT data, keeping existing file")
          PYEOF

      - name: Add metadata
        run: |
          python3 << 'PYEOF'
          import json
          import os
          from datetime import datetime, timezone

          forex_count = 0
          commod_count = 0
          forex_date = 'unknown'
          commod_date = 'unknown'

          if os.path.exists('data/cot/forex_cot.json'):
              try:
                  with open('data/cot/forex_cot.json') as f:
                      d = json.load(f)
                      forex_count = d.get('count', 0)
                      forex_date = d.get('report_date', 'unknown')
              except: pass
          if os.path.exists('data/cot/commodities_cot.json'):
              try:
                  with open('data/cot/commodities_cot.json') as f:
                      d = json.load(f)
                      commod_count = d.get('count', 0)
                      commod_date = d.get('report_date', 'unknown')
              except: pass

          meta = {
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'forex_currencies_count': forex_count,
              'forex_report_date': forex_date,
              'commodities_count': commod_count,
              'commodities_report_date': commod_date,
              'source': 'CFTC Public API (Socrata)',
              'mirror_by': 'github-actions/qep-calendar-mirror',
              'next_refresh': 'Friday 21:00 UTC',
          }
          with open('data/cot/meta.json', 'w') as f:
              json.dump(meta, f, indent=2)
          print(f"META: {forex_count} forex (week {forex_date}) + {commod_count} commodities (week {commod_date})")
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cot/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No COT changes"
          else
            git commit -m "Auto-refresh COT $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "COT push successful"
          fi
